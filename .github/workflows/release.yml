name: Build & Release Pentagon Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-and-windows:
    name: Build Linux & Windows Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pentagon-frontend/package-lock.json

      - name: Install dependencies
        working-directory: pentagon-frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: pentagon-frontend
        run: npm run build

      - name: Build Linux packages (AppImage & deb)
        working-directory: pentagon-frontend
        run: npx electron-builder --linux AppImage deb

      - name: Build Windows portable package (zip)
        working-directory: pentagon-frontend
        run: npx electron-builder --win zip

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            pentagon-frontend/release/*.AppImage
            pentagon-frontend/release/*.deb
            pentagon-frontend/release/*.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pentagon-frontend/package-lock.json

      - name: Install dependencies
        working-directory: pentagon-frontend
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: pentagon-frontend
        run: npm run mobile:sync

      - name: Build Android APK
        working-directory: pentagon-frontend/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: pentagon-frontend/android/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Publish GitHub Release
    needs: [build-linux-and-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
